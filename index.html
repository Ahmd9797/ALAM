<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مكتب إعلام شركة فاوري ذي قار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .app-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 60px;
            color: white;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .download-btn {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            margin: 10px 0;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
        .features {
            margin-top: 30px;
            text-align: right;
        }
        .feature {
            padding: 10px;
            margin: 5px 0;
            background: #f5f5f5;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-icon">🏢</div>
        <h1>مكتب إعلام شركة فاوري ذي قار</h1>
        <p class="subtitle">تطبيق متكامل لإدارة وعرض الأعمال والمشاريع</p>
        
        <a href="#" class="download-btn">📱 تحميل للأندرويد</a>
        <a href="#" class="download-btn">🍎 تحميل للآيفون</a>
        
        <div class="features">
            <h3>مميزات التطبيق:</h3>
            <div class="feature">✓ عرض المشاريع المنجزة</div>
            <div class="feature">✓ آراء العملاء</div>
            <div class="feature">✓ العروض والخصومات</div>
            <div class="feature">✓ التواصل المباشر</div>
        </div>
    </div>
</body>
</html>
